spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/rider?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 4
  jpa:
    hibernate:
      ddl-auto: update
