spring:
  application:
    name: rider-voice-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  paths-to-match: /api/v1/**
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

kakao:
  local:
    rest-api-key: ${KAKAO_LOCAL_REST_API_KEY:${KAKAO_CLIENT_ID:}}
    base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
    timeout: ${KAKAO_LOCAL_TIMEOUT:2s}
