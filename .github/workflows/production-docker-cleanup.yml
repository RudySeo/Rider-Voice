name: Production Docker image cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-production:
    name: Prune unreferenced production Docker images
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: rider-voice-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: rider-voice-cleanup-${{ github.run_id }}

      - name: Prune only images unreferenced by containers through SSM
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup_command='sudo docker image prune --all --force && df -h /var/lib/containerd'
          parameters="$(jq -cn \
            --arg command "$cleanup_command" \
            '{commands: [$command], executionTimeout: ["120"]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Rider Voice unreferenced Docker image cleanup' \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          invocation=''
          status='Pending'
          for attempt in $(seq 1 36); do
            invocation="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>/dev/null || true)"
            if [[ -z "$invocation" ]]; then
              sleep 5
              continue
            fi

            status="$(jq -r '.Status' <<< "$invocation")"
            case "$status" in
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              Success)
                jq -r '.StandardOutputContent' <<< "$invocation"
                exit 0
                ;;
              *)
                jq -r '.StandardOutputContent' <<< "$invocation"
                jq -r '.StandardErrorContent' <<< "$invocation" >&2
                echo "SSM cleanup failed with status $status." >&2
                exit 1
                ;;
            esac
          done

          if [[ -n "$invocation" ]]; then
            jq -r '.StandardOutputContent' <<< "$invocation"
            jq -r '.StandardErrorContent' <<< "$invocation" >&2
          fi
          echo "SSM cleanup timed out while status was $status." >&2
          exit 1

      - name: Summarize cleanup
        run: |
          {
            echo '## Production Docker image cleanup'
            echo
            echo "- Instance: \`$EC2_INSTANCE_ID\`"
            echo '- Removed only images not referenced by any container.'
            echo '- Preserved containers, networks, and volumes.'
          } >> "$GITHUB_STEP_SUMMARY"
