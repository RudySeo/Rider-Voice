name: Monorepo PR CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: monorepo-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        run: |
          python3 ci/detect_ci_changes.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

  backend-test:
    name: Backend test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Validate workflow contracts
        run: python3 -m unittest ci.test_master_ci_cd_workflow ci.test_ci_change_detection ci.test_flyway_schema_contract ci.test_aws_deployment_contract ci.test_monitoring_contract

      - name: Build backend
        run: ./gradlew build --no-daemon

  integration-and-container-smoke:
    name: MySQL integration and container smoke
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/rider?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: ci_app
      DB_PASSWORD: ci-app-password
      DB_MIGRATION_USERNAME: ci_migration
      DB_MIGRATION_PASSWORD: ci-migration-password
      KAKAO_CLIENT_ID: ci-test-client
      KAKAO_LOCAL_REST_API_KEY: ci-test-key
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password
    services:
      mysql:
        image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
        env:
          MYSQL_DATABASE: rider
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Create migration and runtime database users
        run: |
          docker exec "${{ job.services.mysql.id }}" mysql --user=root --password=ci-root-password --execute="
            CREATE USER 'ci_migration'@'%' IDENTIFIED BY 'ci-migration-password';
            CREATE USER 'ci_app'@'%' IDENTIFIED BY 'ci-app-password';
            GRANT CREATE, ALTER, DROP, INDEX, REFERENCES, SELECT, INSERT, UPDATE, DELETE ON rider.* TO 'ci_migration'@'%';
            GRANT SELECT, INSERT, UPDATE, DELETE ON rider.* TO 'ci_app'@'%';
          "

      - name: Run Flyway migration tests
        run: ./gradlew migrationTest --no-daemon
        env:
          DB_USERNAME: ci_app
          DB_PASSWORD: ci-app-password

      - name: Verify runtime user cannot change the schema
        run: |
          if docker exec "${{ job.services.mysql.id }}" mysql \
            --host=127.0.0.1 \
            --user=ci_app \
            --password=ci-app-password \
            --execute="CREATE TABLE rider.runtime_ddl_probe (id BIGINT PRIMARY KEY)"; then
            echo "Runtime database user unexpectedly has DDL permission"
            exit 1
          fi

      - name: Run MySQL integration tests
        run: ./gradlew integrationTest --no-daemon
        env:
          DB_USERNAME: root
          DB_PASSWORD: ci-root-password

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build backend image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: rider-voice-api:ci
          cache-from: type=gha,scope=rider-voice-backend
          cache-to: type=gha,mode=max,scope=rider-voice-backend
          provenance: false

      - name: Start backend container
        run: |
          docker run --detach \
            --name rider-voice-smoke \
            --add-host host.docker.internal:host-gateway \
            --publish 8080:8080 \
            --env SPRING_PROFILES_ACTIVE=prod \
            --env DB_URL=jdbc:mysql://host.docker.internal:3306/rider?connectionTimeZone=UTC\&forceConnectionTimeZoneToSession=true \
            --env DB_USERNAME \
            --env DB_PASSWORD \
            --env DB_MIGRATION_USERNAME \
            --env DB_MIGRATION_PASSWORD \
            --env KAKAO_CLIENT_ID \
            --env KAKAO_LOCAL_REST_API_KEY \
            --env KAKAO_REDIRECT_URI=http://127.0.0.1:8080/api/v1/auth/oauth2/callback/kakao \
            rider-voice-api:ci

      - name: Verify backend health
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health | grep --quiet '"status":"UP"'; then
              exit 0
            fi
            if [ "$(docker inspect --format='{{.State.Running}}' rider-voice-smoke 2>/dev/null || true)" != "true" ]; then
              docker logs rider-voice-smoke || true
              exit 1
            fi
            sleep 2
          done
          docker logs rider-voice-smoke || true
          exit 1

      - name: Start monitoring stack
        run: docker compose -f monitoring/compose.yml up --detach --pull always

      - name: Verify monitoring stack
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:9090/-/ready >/dev/null && \
               curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && \
               curl --fail --silent --get \
                 --data-urlencode 'query=up{job="rider-voice-api"}' \
                 http://127.0.0.1:9090/api/v1/query | jq --exit-status '.data.result[0].value[1] == "1"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f monitoring/compose.yml logs || true
          exit 1

      - name: Collect container logs and clean up
        if: always()
        run: |
          docker logs rider-voice-smoke || true
          docker compose -f monitoring/compose.yml logs || true
          docker compose -f monitoring/compose.yml down --volumes || true
          docker rm --force rider-voice-smoke || true

  mobile-test:
    name: Mobile test
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check mobile app
        run: pnpm run typecheck

      - name: Lint mobile app
        run: pnpm run lint

      - name: Test mobile app
        run: pnpm run test

      - name: Check Expo dependency compatibility
        run: pnpm exec expo install --check

      - name: Export iOS app
        run: pnpm exec expo export --platform ios --output-dir "$RUNNER_TEMP/mobile-ios-export"

      - name: Export Android app
        run: pnpm exec expo export --platform android --output-dir "$RUNNER_TEMP/mobile-android-export"

  ci-gate:
    name: PR CI gate
    if: always()
    needs:
      - changes
      - backend-test
      - integration-and-container-smoke
      - mobile-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected validation to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_TEST_RESULT: ${{ needs.backend-test.result }}
          INTEGRATION_RESULT: ${{ needs.integration-and-container-smoke.result }}
          MOBILE_RESULT: ${{ needs.mobile-test.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          for result in \
            "$BACKEND_TEST_RESULT" \
            "$INTEGRATION_RESULT" \
            "$MOBILE_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
