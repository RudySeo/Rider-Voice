name: Feature branch Draft PR and CI

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: feature-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-draft-pr:
    name: Create Draft PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create develop Draft PR once
        uses: actions/github-script@v9
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headBranch = process.env.HEAD_BRANCH;
            const baseBranch = 'develop';
            const head = `${owner}:${headBranch}`;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base: baseBranch,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              core.notice(`Draft PR already exists: #${existing.data[0].number}`);
              return;
            }

            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: baseBranch,
              head: headBranch,
            });

            if (comparison.data.ahead_by === 0) {
              core.notice(`No commits ahead of ${baseBranch}; PR creation is deferred.`);
              return;
            }

            const commitMessage = process.env.HEAD_COMMIT_MESSAGE || headBranch;
            const title = commitMessage.split(/\r?\n/, 1)[0].trim() || headBranch;
            const body = [
              '## Summary',
              '',
              `Draft PR created automatically from \`${headBranch}\`.`,
              '',
              '## Checklist',
              '',
              '- [ ] Backend and frontend CI pass',
              '- [ ] Related documentation and OpenAPI contract are updated',
              '- [ ] No secrets, tokens, or personal data are included',
              '- [ ] Existing tests were not deleted or weakened',
              '- [ ] Ready for review is selected when the change is reviewable',
            ].join('\n');

            const created = await github.rest.pulls.create({
              owner,
              repo,
              base: baseBranch,
              head: headBranch,
              title,
              body,
              draft: true,
            });

            core.notice(`Created Draft PR #${created.data.number}`);

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Validate workflow contract
        run: python3 scripts/test_feature_pr_workflow.py

      - name: Build backend
        run: ./gradlew build

  frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build
