name: Backend master publish

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: backend-master-publish
  cancel-in-progress: false

jobs:
  publish-image:
    name: Publish Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: docker-hub
    outputs:
      image_name: ${{ steps.release.outputs.image_name }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      image_digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/rider-voice-api
      DOCKER_METADATA_SHORT_SHA_LENGTH: '12'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push backend image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rider-voice-backend
          cache-to: type=gha,mode=max,scope=rider-voice-backend
          provenance: mode=max
          sbom: true

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Export immutable release
        id: release
        run: |
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Summarize published image
        run: |
          {
            echo "## Published backend image"
            echo
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- Tags:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/  - `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy backend to production EC2
    needs: publish-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: rider-voice-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_NAME: ${{ needs.publish-image.outputs.image_name }}
      IMAGE_TAG: ${{ needs.publish-image.outputs.image_tag }}
    steps:
      - name: Checkout deployment client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: rider-voice-${{ github.run_id }}

      - name: Deploy immutable image through SSM
        run: deploy/github/send-ssm-deploy.sh "$EC2_INSTANCE_ID" "$IMAGE_NAME" "$IMAGE_TAG"

      - name: Summarize production deployment
        if: success()
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Instance: \`${EC2_INSTANCE_ID}\`"
            echo "- Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- Digest: \`${{ needs.publish-image.outputs.image_digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
