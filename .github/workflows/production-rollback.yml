name: Backend production rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Previously published immutable tag, for example sha-81eb17b7a492
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback-production:
    name: Roll back production EC2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: rider-voice-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/rider-voice-api
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Checkout deployment client from master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Resolve master release commit
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: rider-voice-rollback-${{ github.run_id }}

      - name: Deploy selected previous image through SSM
        run: deploy/github/send-ssm-deploy.sh "$EC2_INSTANCE_ID" "$IMAGE_NAME" "$IMAGE_TAG" "${{ steps.release.outputs.sha }}"

      - name: Summarize rollback
        if: success()
        run: |
          {
            echo "## Production rollback"
            echo
            echo "- Instance: \`${EC2_INSTANCE_ID}\`"
            echo "- Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
